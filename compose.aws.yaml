services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://${RDS_HOST:?Configura RDS_HOST}:5432/idontknowdb?sslmode=verify-full&sslrootcert=/etc/rds/global-bundle.pem
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
      GROQ_API_KEY: ${GROQ_API_KEY:-dummy}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-dummy@example.com}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:-dummy}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    mem_limit: 1g
    volumes:
      - ./rds-ca.pem:/etc/rds/global-bundle.pem:ro
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BACKEND_ORIGIN: http://backend:8080
